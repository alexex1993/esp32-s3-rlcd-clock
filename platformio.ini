; ESP32-S3-RLCD-4.2 (Waveshare, SKU 33298 / 33507)
; 4.2" reflective monochrome LCD, ST7305, 300 x 400, no backlight.
;
; Module: ESP32-S3-WROOM-1-N16R8 -> 16 MB QIO flash + 8 MB OPI PSRAM.

[env:esp32-s3-rlcd-4_2]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; N16R8 memory layout. Without qio_opi the PSRAM is not brought up.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.partitions          = default_16MB.csv
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216

; The Type-C port is wired to the ESP32-S3 native USB (USB-Serial/JTAG),
; there is no UART bridge chip on this board, so Serial must be the USB CDC.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Secrets come from .env (SSID= / PWD= / NEWS_API= / TOKEN_BOT= / SOCKS5_*),
; which scripts/env_flags.py turns into -D macros. Each gates a different part
; of the firmware: no SSID means no radio, no NEWS_API means no news screen,
; no TOKEN_BOT or SOCKS5_HOST means no pager screen. Without the file at all
; the firmware builds fine and the RTC is set from the console instead.
extra_scripts = pre:scripts/env_flags.py

monitor_speed = 115200

; U8g2 >= 2.36.18 ships u8x8_d_st7305_300x400, which is exactly this panel.
; Still the only entry: the SOCKS5 client is written against RFC 1928/1929 and
; the TLS under it is the ESP-IDF's own mbedTLS, already in the SDK.
lib_deps =
    olikraus/U8g2@^2.36.18
