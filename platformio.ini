; ESP32-S3-RLCD-4.2 (Waveshare, SKU 33298 / 33507)
; 4.2" reflective monochrome LCD, ST7305, 300 x 400, no backlight.
;
; Module: ESP32-S3-WROOM-1-N16R8 -> 16 MB QIO flash + 8 MB OPI PSRAM.

; The four modes this firmware can carry, each one switchable here: 1 builds
; the screen in, 0 leaves it out of the firmware entirely -- no code, no
; fetch, no session, and no place in the cycle KEY steps through. They are all
; on by default; turn off what a particular board is not for.
;
;   clock  time, outdoor conditions, the 12-hour forecast, sunset, battery
;   news   world headlines, fetched when KEY brings the screen up
;   pager  the live Telegram pager over the SOCKS5 tunnel, with the chirp
;   pc     live GPU/CPU/VRAM/FPS from rtss_api on the LAN
;
; A mode still needs whatever .env gives it -- news wants NEWS_API, the pager
; wants TOKEN_BOT and SOCKS5_HOST, the PC screen wants RTSS_HOST -- and says
; on the panel which one is missing. Switching the mode off here is the other
; question: whether the screen exists at all.
;
; With all four at 0 the firmware still builds and runs; the panel says there
; is nothing switched on.
[modes]
clock = 1
news  = 1
pager = 1
pc    = 1

[env:esp32-s3-rlcd-4_2]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; N16R8 memory layout. Without qio_opi the PSRAM is not brought up.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.partitions          = default_16MB.csv
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216

; The Type-C port is wired to the ESP32-S3 native USB (USB-Serial/JTAG),
; there is no UART bridge chip on this board, so Serial must be the USB CDC.
;
; The four MODE_ macros are the [modes] switches at the top of this file.
; app.h defaults every one of them to 1, so a build that never passes them --
; a stray `pio ci`, another project including these sources -- is the full
; firmware rather than an empty one.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DMODE_CLOCK=${modes.clock}
    -DMODE_NEWS=${modes.news}
    -DMODE_PAGER=${modes.pager}
    -DMODE_PC=${modes.pc}

; Secrets come from .env (SSID= / PWD= / NEWS_API= / TOKEN_BOT= / SOCKS5_* /
; RTSS_*), which scripts/env_flags.py turns into -D macros. Each gates a
; different part of the firmware: no SSID means no radio, no NEWS_API means no
; news screen, no TOKEN_BOT or SOCKS5_HOST means no pager screen, no RTSS_HOST
; means no PC screen. Without the file at all the firmware builds fine and the
; RTC is set from the console instead.
extra_scripts = pre:scripts/env_flags.py

monitor_speed = 115200

; U8g2 >= 2.36.18 ships u8x8_d_st7305_300x400, which is exactly this panel.
; Still the only entry: the SOCKS5 client is written against RFC 1928/1929 and
; the TLS under it is the ESP-IDF's own mbedTLS, already in the SDK.
lib_deps =
    olikraus/U8g2@^2.36.18
